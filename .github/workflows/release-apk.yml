name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión (ej. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: ⬇️ Checkout del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: ⚙️ Generar proyecto nativo Android (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 🐘 Configurar Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Compilar APK Release con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: 🏷️ Preparar archivo APK
        id: prepare_apk
        run: |
          TAG="${{ github.ref_name }}"
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi
          
          APK_NAME="obd2scanner-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 🚀 Publicar GitHub Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag }}
          name: Release ${{ steps.prepare_apk.outputs.tag }}
          files: ${{ steps.prepare_apk.outputs.apk_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
